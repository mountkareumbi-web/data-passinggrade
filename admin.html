<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD INPRES BINANGA 1 - DASHBOARD PASSING GRADE (ADMIN)</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .header h2 { color: #0d5bb5; font-size: 22px; }
    .header p { font-size: 13px; color: #666; }
    
    .badge-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .status-live { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
    
    .action-bar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: flex-end; }
    .btn { padding: 9px 16px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-print { background: #1677ff; color: white; }
    .btn-print:hover { background: #0958d9; }
    .btn-reset { background: #ff4d4f; color: white; }
    .btn-reset:hover { background: #d9363e; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e8e8e8; font-size: 14px; }
    th { background-color: #fafafa; color: #555; font-weight: 700; }
    tr:hover { background-color: #f6f9fc; }
    
    .badge-predikat { padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; display: inline-block; }
    .sangat-baik { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; } /* Sangat Baik (Hijau) */
    .baik { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }        /* Baik (Biru) */
    .cukup { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }       /* Cukup (Kuning) */
    .kurang { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }      /* Kurang (Merah) */
    
    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; border-radius: 0; padding: 0; }
      .action-bar, .badge-status { display: none !important; }
      th, td { border: 1px solid #333 !important; padding: 8px !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2><i class="fa-solid fa-chart-line"></i> Monitoring Passing Grade Ujian</h2>
      <p>SD INPRES BINANGA 1 - CBT 2026</p>
    </div>
    <div>
      <span class="badge-status status-live"><i class="fa-solid fa-rotate fa-spin"></i> Live Update (1 Detik)</span>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> Cetak PDF</button>
    <button class="btn btn-reset" onclick="resetData()"><i class="fa-solid fa-trash"></i> Reset Data</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>NISN</th>
        <th>Nama Siswa</th>
        <th>Kelas</th>
        <th>Nilai PG</th>
        <th>Predikat / Passing Grade</th>
        <th>Status Ujian</th>
      </tr>
    </thead>
    <tbody id="tabel-hasil">
      <tr>
        <td colspan="7" style="text-align: center; color: #888;">Memuat data nilai...</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyreCihaaImDXUSIc2axAfu1x_NP-U225QFM7GgnGyby9BJWOzl5q1d3ycs1MQWR3Zp/exec";

  function getPassingGradeInfo(score) {
    if (score >= 200) {
      return { teks: "Sangat Baik", class: "sangat-baik" };
    } else if (score >= 160) {
      return { teks: "Baik", class: "baik" };
    } else if (score >= 120) {
      return { teks: "Cukup", class: "cukup" };
    } else {
      return { teks: "Kurang", class: "kurang" };
    }
  }

  function fetchDataRealtime() {
    fetch(GOOGLE_SCRIPT_URL + "?action=read")
      .then(res => res.json())
      .then(data => {
        renderTabel(data);
      })
      .catch(err => {
        console.log("Sync error:", err);
      });
  }

  function renderTabel(dataList) {
    const tbody = document.getElementById("tabel-hasil");
    if (!dataList || dataList.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #888;">Belum ada data nilai masuk.</td></tr>`;
      return;
    }

    tbody.innerHTML = "";
    dataList.forEach((item, index) => {
      const pgInfo = getPassingGradeInfo(item.skorPG);
      const statusUjian = item.selesai ? 
        '<span style="color:#52c41a; font-weight:bold;">Selesai</span>' : 
        '<span style="color:#1677ff; font-weight:bold;">Sedang Mengerjakan</span>';

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${index + 1}</td>
        <td><b>${item.nisn}</b></td>
        <td>${item.nama}</td>
        <td>${item.kelas}</td>
        <td><b>${item.skorPG}</b> / 240</td>
        <td><span class="badge-predikat ${pgInfo.class}">${pgInfo.teks}</span></td>
        <td>${statusUjian}</td>
      `;
      tbody.appendChild(row);
    });
  }

  function resetData() {
    if (confirm("Apakah Anda yakin ingin menghapus seluruh data nilai passing grade?")) {
      fetch(GOOGLE_SCRIPT_URL + "?action=reset", { method: "POST", mode: "no-cors" })
        .then(() => {
          alert("Data berhasil di-reset!");
          fetchDataRealtime();
        })
        .catch(err => alert("Gagal mereset data: " + err));
    }
  }

  setInterval(fetchDataRealtime, 1000);
  fetchDataRealtime();
</script>

</body>
</html>
